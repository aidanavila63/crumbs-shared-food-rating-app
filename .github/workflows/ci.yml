# #227 #232 Checks on every push and pull request (free on GitHub for public and small private repos):
# types, unit tests, lint, a production build, the database security tests on a real Postgres,
# and a click-through of the demo build.
name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec eslint components lib hooks app
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      # Round 58: how big the app's JavaScript is, in the run summary, so a change that makes the
      # phone download a lot more shows up. (Gzipped, all browser chunks together.)
      - name: Bundle size
        run: |
          total=$(find .next/static/chunks -name '*.js' -print0 | xargs -0 -I{} sh -c 'gzip -c "{}" | wc -c' | awk '{s+=$1} END {print s}')
          echo "### Browser JavaScript (gzipped)" >> "$GITHUB_STEP_SUMMARY"
          echo "$((total / 1024)) KB across all chunks" >> "$GITHUB_STEP_SUMMARY"
          find .next/static/chunks -name '*.js' -print0 | xargs -0 ls -S | head -5 | while read f; do
            echo "- $(basename "$f"): $(( $(gzip -c "$f" | wc -c) / 1024 )) KB" >> "$GITHUB_STEP_SUMMARY"
          done

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bash supabase/tests/run.sh

  demo-click-through:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - run: pnpm exec playwright install --with-deps chromium
      - run: |
          pnpm start -p 3000 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000 >/dev/null && break; sleep 1; done
          node tests/e2e/smoke.mjs http://localhost:3000
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'
